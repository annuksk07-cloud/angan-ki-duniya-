<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #333; color: white; height: 100vh; width: 100vw; overflow: hidden; }
  .container { position: absolute; inset: 0; width: 100vw; height: 100vh; }
  .valance { position: absolute; top: 0; left: 0; width: 100%; height: 22%; object-fit: cover; object-position: top center; border: 1px solid red; }
  .left-side { position: absolute; top: 0; left: 0; height: 100%; width: auto; object-fit: cover; object-position: left top; border: 1px solid blue; }
  .right-side { position: absolute; top: 0; right: 0; height: 100%; width: auto; object-fit: cover; object-position: right top; border: 1px solid green; }
</style>
</head>
<body>
<div class="container">
  <!-- Valance -->
  <img src="curtain.png" class="valance" />
  <!-- Left -->
  <img src="curtain.png" class="left-side" />
  <!-- Right -->
  <img src="curtain.png" class="right-side" />
</div>
</body>
</html>
