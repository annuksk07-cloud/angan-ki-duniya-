<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4a151b" />
      <stop offset="60%" stop-color="#2b080c" />
      <stop offset="100%" stop-color="#190406" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D89A32" />
      <stop offset="70%" stop-color="#B78B4A" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85" />

  <!-- Ornate Arch / Mandap Dome Silhouette -->
  <path d="M 160 350 C 160 230, 210 160, 256 120 C 302 160, 352 230, 352 350 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.75" />
  <path d="M 180 350 C 180 250, 220 190, 256 155 C 292 190, 332 250, 332 350" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5" />

  <!-- Sacred Kalash Finial Top Motif -->
  <circle cx="256" cy="116" r="8" fill="url(#goldGrad)" />
  <path d="M 256 94 L 259 108 L 253 108 Z" fill="url(#goldGrad)" />

  <!-- Center Sacred Motif: Devanagari Aangan Calligraphy Symbol -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Main Decorative 'आ' Typography -->
    <text x="256" y="278" font-family="'Tiro Devanagari Hindi', 'Cinzel', serif" font-size="105" font-weight="bold" text-anchor="middle">
      आ
    </text>
    <!-- Subtitle: AANGAN -->
    <text x="256" y="324" font-family="'Cinzel', serif" font-size="22" letter-spacing="6" font-weight="600" text-anchor="middle">
      AANGAN
    </text>
  </g>

  <!-- Base Decorative Flourish -->
  <path d="M 200 350 Q 256 365 312 350" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="360" r="4" fill="url(#goldGrad)" />
</svg>
